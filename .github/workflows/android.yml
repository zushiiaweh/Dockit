name: android-apk
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Copy the web files
        run: |
          mkdir -p www
          cp index.html manifest.json privacy.html terms.html www/
          cp icon-*.png apple-touch-icon.png www/
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/local-notifications@6 @capacitor/status-bar@6 @capacitor/splash-screen@6 @capacitor/filesystem@6 @capacitor/share@6
      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Add the QR scanner
        run: |
          npm install @capacitor-mlkit/barcode-scanning@6
          npx cap sync android
      - name: Add the Downloads helper
        run: |
          D=android/app/src/main/java/com/zushiiaweh/dockit
          mkdir -p $D
          cat > $D/DownloaderPlugin.java <<'EOF'
          package com.zushiiaweh.dockit;

          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "Downloader")
          public class DownloaderPlugin extends Plugin {
            @PluginMethod
            public void save(PluginCall call) {
              String name = call.getString("name");
              String mime = call.getString("mime", "application/octet-stream");
              String data = call.getString("data");
              if (name == null || data == null) {
                call.reject("Missing name or data");
                return;
              }
              try {
                byte[] bytes = Base64.decode(data, Base64.DEFAULT);
                JSObject r = new JSObject();
                if (Build.VERSION.SDK_INT >= 29) {
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                  v.put(MediaStore.Downloads.MIME_TYPE, mime);
                  v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                  Uri uri = getContext().getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                  if (uri == null) {
                    call.reject("Could not create the file");
                    return;
                  }
                  OutputStream os = getContext().getContentResolver().openOutputStream(uri);
                  os.write(bytes);
                  os.close();
                  r.put("uri", uri.toString());
                } else {
                  File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                  dir.mkdirs();
                  File f = new File(dir, name);
                  FileOutputStream fo = new FileOutputStream(f);
                  fo.write(bytes);
                  fo.close();
                  r.put("uri", f.getAbsolutePath());
                }
                r.put("name", name);
                call.resolve(r);
              } catch (Exception e) {
                call.reject("Save failed: " + e.getMessage());
              }
            }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.zushiiaweh.dockit;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(DownloaderPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
      - name: Icons, splash screen and colours
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y imagemagick
          fi
          IM=$(command -v magick || command -v convert)
          R=android/app/src/main/res
          for spec in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read d l f <<< "$spec"
            mkdir -p $R/mipmap-$d
            $IM icon-dark-1024.png -resize ${l}x${l} $R/mipmap-$d/ic_launcher.png
            $IM icon-dark-1024.png -resize ${l}x${l} $R/mipmap-$d/ic_launcher_round.png
            $IM -size ${f}x${f} xc:none \( icon-dark-maskable-1024.png -resize $((f*78/100))x$((f*78/100)) \) -gravity center -composite PNG32:$R/mipmap-$d/ic_launcher_foreground.png
          done
          mkdir -p $R/mipmap-anydpi-v26 $R/values $R/drawable
          cat > $R/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp $R/mipmap-anydpi-v26/ic_launcher.xml $R/mipmap-anydpi-v26/ic_launcher_round.xml
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#2f2d2d</color></resources>' > $R/values/ic_launcher_background.xml
          $IM -size 1200x1200 xc:'#2f2d2d' \( icon-dark-1024.png -resize 420x420 \) -gravity center -composite splash.png
          find $R -name 'splash.png' | while read f; do cp splash.png "$f"; done
          $IM -size 96x96 xc:none -fill white -draw "roundrectangle 36,10 60,86 6,6" -draw "roundrectangle 10,36 86,60 6,6" PNG32:$R/drawable/ic_stat_dockit.png
          sed -i 's|</style>|    <item name="android:statusBarColor">#3d3a3a</item>\n    <item name="android:navigationBarColor">#3d3a3a</item>\n</style>|g' $R/values/styles.xml
      - name: Permissions, links and version
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = (
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n'
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n'
          )
          link = (
              '<intent-filter>\n'
              '    <action android:name="android.intent.action.VIEW"/>\n'
              '    <category android:name="android.intent.category.DEFAULT"/>\n'
              '    <category android:name="android.intent.category.BROWSABLE"/>\n'
              '    <data android:scheme="https" android:host="zushiiaweh.github.io" android:pathPrefix="/Dockit"/>\n'
              '</intent-filter>\n'
          )
          assert "</manifest>" in s and "</activity>" in s
          s = s.replace("</activity>", link + "</activity>", 1)
          s = s.replace("</manifest>", perms + "</manifest>", 1)
          # Health data: do not let Android copy app data into cloud/adb backups
          s = s.replace('android:allowBackup="true"', 'android:allowBackup="false"')
          open(p, "w", encoding="utf-8").write(s)
          PY
          RUN=${{ github.run_number }}
          sed -i "s/versionCode 1/versionCode $RUN/; s/versionName \"1.0\"/versionName \"1.0.$RUN\"/" android/app/build.gradle
      - name: Release signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "::error::Missing secrets. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD and KEY_ALIAS under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/dockit-release.jks"
          echo "KS_PATH=$RUNNER_TEMP/dockit-release.jks" >> "$GITHUB_ENV"
          # Fails here, with a clear message, if the password or alias is wrong
          keytool -list -keystore "$RUNNER_TEMP/dockit-release.jks" -storepass "$KS_PASS" -alias "$KS_ALIAS" > /dev/null
          echo "Signing key OK"
      - name: Wire up release signing
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/build.gradle"
          g = open(p, encoding="utf-8").read()
          signing = (
              '    signingConfigs {\n'
              '        release {\n'
              '            storeFile file(System.getenv("KS_PATH"))\n'
              '            storePassword System.getenv("KS_PASS")\n'
              '            keyAlias System.getenv("KS_ALIAS")\n'
              '            keyPassword System.getenv("KS_PASS")\n'
              '        }\n'
              '    }\n'
          )
          assert "buildTypes {" in g, "buildTypes block not found in build.gradle"
          g = g.replace("buildTypes {", signing + "    buildTypes {", 1)
          g, n = re.subn(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', g, count=1)
          assert n == 1, "release block not found in build.gradle"
          open(p, "w", encoding="utf-8").write(g)
          PY
      - name: Build the APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Check the signature
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk dockit.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs dockit.apk || echo "Could not run apksigner check"
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" dockit.apk --title "Dockit app v${{ github.run_number }}" --notes "Android app build ${{ github.run_number }}" --latest
