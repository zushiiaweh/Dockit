name: android-apk
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Copy the web files
        run: |
          mkdir -p www
          cp index.html manifest.json privacy.html terms.html www/
          cp icon-*.png apple-touch-icon.png www/
      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/local-notifications@6 @capacitor/status-bar@6 @capacitor/splash-screen@6 @capacitor/filesystem@6 @capacitor/share@6
      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Icons, splash screen and colours
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y imagemagick
          fi
          IM=$(command -v magick || command -v convert)
          R=android/app/src/main/res
          for spec in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read d l f <<< "$spec"
            mkdir -p $R/mipmap-$d
            $IM icon-dark-1024.png -resize ${l}x${l} $R/mipmap-$d/ic_launcher.png
            $IM icon-dark-1024.png -resize ${l}x${l} $R/mipmap-$d/ic_launcher_round.png
            $IM -size ${f}x${f} xc:none \( icon-dark-maskable-1024.png -resize $((f*78/100))x$((f*78/100)) \) -gravity center -composite PNG32:$R/mipmap-$d/ic_launcher_foreground.png
          done
          mkdir -p $R/mipmap-anydpi-v26 $R/values $R/drawable
          cat > $R/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp $R/mipmap-anydpi-v26/ic_launcher.xml $R/mipmap-anydpi-v26/ic_launcher_round.xml
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#2f2d2d</color></resources>' > $R/values/ic_launcher_background.xml
          $IM -size 1200x1200 xc:'#2f2d2d' \( icon-dark-1024.png -resize 420x420 \) -gravity center -composite splash.png
          find $R -name 'splash.png' | while read f; do cp splash.png "$f"; done
          $IM -size 96x96 xc:none -fill white -draw "roundrectangle 36,10 60,86 6,6" -draw "roundrectangle 10,36 86,60 6,6" PNG32:$R/drawable/ic_stat_dockit.png
          sed -i 's|</style>|    <item name="android:statusBarColor">#3d3a3a</item>\n    <item name="android:navigationBarColor">#3d3a3a</item>\n</style>|g' $R/values/styles.xml
      - name: Permissions, links and version
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = (
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n'
              '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n'
          )
          link = (
              '<intent-filter>\n'
              '    <action android:name="android.intent.action.VIEW"/>\n'
              '    <category android:name="android.intent.category.DEFAULT"/>\n'
              '    <category android:name="android.intent.category.BROWSABLE"/>\n'
              '    <data android:scheme="https" android:host="zushiiaweh.github.io" android:pathPrefix="/Dockit"/>\n'
              '</intent-filter>\n'
          )
          assert "</manifest>" in s and "</activity>" in s
          s = s.replace("</activity>", link + "</activity>", 1)
          s = s.replace("</manifest>", perms + "</manifest>", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
          RUN=${{ github.run_number }}
          sed -i "s/versionCode 1/versionCode $RUN/; s/versionName \"1.0\"/versionName \"1.0.$RUN\"/" android/app/build.gradle
      - name: Saved signing key (optional)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Using the saved signing key"
          else
            echo "No saved signing key, using a new one"
          fi
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk dockit.apk
          gh release create "v${{ github.run_number }}" dockit.apk --title "Dockit app v${{ github.run_number }}" --notes "Android app build ${{ github.run_number }}" --latest
