<style>

:root[data-theme="dark"]{--bg:#3d3a3a;--card:#4a4747;--card2:#545151;--edge:#2f2d2d;--ink:#f6f6f6;--mut:#c2c2c2;--br:#5c5959;--body:#5a5757;--organ:#6e6b6b;--sh:rgba(0,0,0,.32);--hi:rgba(255,255,255,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:700}
#app{max-width:480px;margin:auto;padding:0 16px 120px;min-height:100vh}
h3{margin:18px 0 10px;font-size:19px;font-weight:800}.mut{color:var(--mut);font-size:13px;margin:0;font-weight:700}
button{font:inherit;font-weight:800;cursor:pointer;border:0;color:inherit}
.hero{position:relative;margin:0 -16px 8px;line-height:0}.ha{width:100%;height:auto;display:block}
.hc{position:absolute;left:50%;bottom:0;width:37%;height:auto;transform:translateX(-50%);animation:fl 3.2s ease-in-out infinite;filter:drop-shadow(0 12px 8px rgba(0,0,0,.22));cursor:pointer}
@keyframes fl{50%{transform:translateX(-50%) translateY(-7px) rotate(-2deg)}}
.bub{position:absolute;left:59%;bottom:25%;width:39%;line-height:1.3;background:var(--card2);color:var(--ink);border-radius:20px;padding:10px 12px;font-size:13.5px;font-weight:800;box-shadow:0 4px 0 var(--edge),0 10px 16px var(--sh)}
.bub::after{content:"";position:absolute;left:-7px;bottom:16px;width:16px;height:16px;background:var(--card2);transform:rotate(45deg);border-radius:3px}
.cp{position:absolute;top:12px;height:42px;line-height:1;display:flex;align-items:center;justify-content:center;border-radius:21px;background:var(--card2);color:var(--ink);font-size:15px;font-weight:800;box-shadow:0 4px 0 var(--edge),0 8px 12px var(--sh)}.cp.l{left:12px;width:42px;font-size:18px}.cp.l2{left:12px;top:62px;padding:0 12px}
.hs{display:flex;gap:12px;overflow-x:auto;padding:6px 4px 16px;scroll-snap-type:x mandatory}
.hb{flex:none;width:98px;border-radius:26px;padding:12px 6px;text-align:center;background:var(--card);position:relative;scroll-snap-align:start;color:var(--ink)}
.hb i{display:grid;place-items:center;width:54px;height:54px;border-radius:18px;margin:0 auto 6px;background:var(--t);box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.14)}.hb svg{width:30px;height:30px}.hb b{display:block;font-size:14px;font-weight:800;white-space:nowrap}.th svg{width:26px;height:26px;display:block;margin:0 auto}.hb span{font-size:11.5px;color:var(--mut)}
.hb.ok{outline:3px solid var(--ac)}.hb.ok::after{content:"✓";position:absolute;top:-7px;right:-5px;background:var(--ac);color:var(--onac);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:14px;box-shadow:0 3px 0 var(--ac2)}
.lk,.dz{display:flex;align-items:center;gap:12px;width:100%;margin:12px 0;border-radius:24px;padding:14px 16px;text-align:left;background:var(--card)}.lk b,.dz b{flex:1;font-size:16.5px}.lk em{font-style:normal;font-size:22px}
.dz i{width:18px;height:18px;border-radius:50%;background:#e43a26;flex:none;box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.sr{display:flex;align-items:center;gap:10px;margin:14px 0}.sr img{width:64px;height:auto;flex:none}
.bub2{position:relative;background:var(--card2);border-radius:20px;padding:11px 14px;font-weight:800;font-size:14.5px;line-height:1.3;flex:1;box-shadow:0 4px 0 var(--edge),0 10px 16px var(--sh)}
.bub2::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-8px;width:16px;height:16px;background:var(--card2);transform:rotate(45deg);border-radius:3px}.bub2 b{display:block;color:var(--ac2)}
.coach{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px);max-width:452px;z-index:90;animation:up .3s;display:flex;align-items:center;gap:10px}.coach img{width:62px;height:auto}
.in{width:100%;border:0;background:var(--card);color:var(--ink);border-radius:18px;padding:14px 16px;font:inherit;margin-bottom:12px;box-shadow:inset 0 3px 0 rgba(0,0,0,.07)}
.fc,.mk,.bc{background:var(--card)}
.fc{display:flex;align-items:center;gap:12px;border-radius:24px;padding:12px;margin-bottom:12px;cursor:pointer;transition:transform .15s}.fc:active{transform:scale(.97)}
.fc,.mk,.hb,.lk,.dz,.bc{box-shadow:0 5px 0 var(--edge),0 12px 18px var(--sh),inset 0 2px 0 var(--hi)}
.av{width:48px;height:48px;border-radius:16px;color:#262626;display:grid;place-items:center;font-weight:900;font-size:20px;flex:none;box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.14)}
.fi{flex:1;min-width:0}.fi b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fi span{font-size:12.5px}
.ch{display:flex;gap:4px}.ch i{font-style:normal;font-size:12px;font-weight:900;min-width:23px;height:23px;border-radius:12px;display:grid;place-items:center;color:#262626}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.bar{display:flex;align-items:center;gap:10px;margin:14px 0 12px}
.ib{width:42px;height:42px;border-radius:15px;background:var(--card2);font-size:19px;color:var(--ink);box-shadow:0 4px 0 var(--edge),0 8px 12px var(--sh)}
.seg{display:flex;background:var(--card);border-radius:18px;padding:4px;margin-bottom:12px;box-shadow:inset 0 3px 0 rgba(0,0,0,.07)}
.seg button{flex:1;background:none;padding:10px 4px;border-radius:14px;color:var(--mut)}.seg .on{background:var(--ac);color:var(--onac);box-shadow:0 3px 0 var(--ac2)}
.chips{display:flex;gap:10px;margin-bottom:12px}.chips button{flex:1;background:var(--card2);border-radius:16px;padding:10px;font-size:14px;box-shadow:0 4px 0 var(--edge)}.chips .on{background:#a5d8f5;color:#262626;box-shadow:0 4px 0 #62a8d8}
.bc{border-radius:28px;padding:10px 6px 12px;text-align:center}
#bd{width:94%;max-width:340px;height:auto;touch-action:manipulation;cursor:crosshair}.hint{margin:4px 0 0;font-size:13px;color:var(--mut)}
.lg2{display:flex;justify-content:space-around;margin:14px 0;font-size:13px}.lg2 span{display:flex;align-items:center;gap:5px}.lg2 i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
.mk{display:flex;gap:12px;align-items:center;border-radius:20px;padding:12px;margin-bottom:10px;cursor:pointer}
.mk>i{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:inset 0 3px 0 rgba(255,255,255,.4)}.mk p{margin:2px 0 0;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pulse{animation:pu 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.3)}}
.ov{position:fixed;inset:0;background:rgba(20,18,18,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fi .2s}
.sh{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:var(--card2);border-radius:30px 30px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}@keyframes fi{from{opacity:0}}
.sh h3{margin:0 0 4px;font-size:22px}.sh textarea{width:100%;height:150px;border:0;background:var(--card);color:var(--ink);border-radius:18px;padding:14px;font:inherit;resize:none;margin:12px 0;box-shadow:inset 0 3px 0 rgba(0,0,0,.07)}
.sv{display:flex;gap:8px;margin-top:10px}.sv button{flex:1;padding:10px 0;border-radius:16px;background:var(--card);border:3px solid transparent;font-size:13px;color:var(--ink)}
.sv button::before{content:"";display:block;width:16px;height:16px;border-radius:50%;background:var(--c);margin:0 auto 4px;box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}.sv .on{border-color:var(--c)}
.row{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;width:100%;background:var(--ac);color:var(--onac);padding:15px;border-radius:20px;font-size:16px;box-shadow:0 5px 0 var(--ac2),0 12px 16px var(--sh),inset 0 2px 0 rgba(255,255,255,.45)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ac2)}
.btn.gh{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--edge),inset 0 2px 0 var(--hi)}.btn.dg{background:var(--card);color:#e43a26;box-shadow:0 5px 0 var(--edge),inset 0 2px 0 var(--hi)}
.nv{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px);max-width:452px;display:flex;justify-content:space-around;background:var(--card2);border-radius:32px;padding:8px;z-index:40;box-shadow:0 5px 0 var(--edge),0 16px 26px var(--sh)}
.nv button{background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:7px 22px;border-radius:24px}.nv svg{width:25px;height:25px;fill:currentColor}.nv .on{background:var(--ac);color:var(--onac);box-shadow:0 3px 0 var(--ac2)}
.bx{height:200px;display:grid;place-items:center;position:relative;margin:10px 0}#bb{position:absolute;width:150px;height:150px;border-radius:32px;background:#5aaeea55;border:5px solid #5aaeea;transform:scale(.6);transition:transform 4s linear}.bx b{position:relative;font-size:22px}
.er{color:#e43a26;font-size:13.5px;min-height:18px;margin:2px 2px 8px}
.lgc{background:var(--card2);border-radius:30px;padding:20px;margin-top:6px;box-shadow:0 6px 0 var(--edge),0 16px 24px var(--sh)}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);transition:opacity .6s}
#splash.hide{opacity:0;pointer-events:none}#splash h2{font-size:46px;font-weight:900;margin:10px 0 0;letter-spacing:-1px;animation:fi 1s .9s both}#splash p{margin:2px 0 0;font-size:19px;color:var(--mut);animation:fi 1s 1.2s both}
.an{animation:pop .8s cubic-bezier(.3,1.6,.5,1) both,bob 2.4s ease-in-out .9s infinite;filter:drop-shadow(0 14px 10px rgba(0,0,0,.22))}@keyframes pop{from{transform:scale(0) rotate(-18deg)}}@keyframes bob{50%{transform:translateY(-9px) rotate(-3deg)}}

.pw{position:relative}.pw .in{padding-right:74px}.eye{position:absolute;right:8px;top:8px;background:none;color:var(--mut);padding:8px 10px;font-size:13px}.sh h3,.fi b{word-break:break-word}
.cp.r2{right:12px;top:76px;width:42px;padding:0}.cp svg{width:24px;height:24px}.fi span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mk>.mut{white-space:nowrap;font-size:12px}.tag{margin:8px 2px 12px;font-size:13.5px;line-height:1.4;color:var(--mut)}.tag b{color:var(--ink)}

.lk b{white-space:nowrap;flex:none}.lk .mut{flex:1;text-align:right;line-height:1.2}
@media (max-width:350px){.lk .mut{display:none}}

.emc{border-radius:26px;overflow:hidden;background:var(--card);box-shadow:0 5px 0 var(--edge),0 14px 24px var(--sh)}.emh{background:#e43a26;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-weight:900;letter-spacing:1.5px}.emh svg{width:26px;height:26px;fill:#fff}
.emb{padding:6px 16px 16px}.emc small{display:block;font-size:10.5px;letter-spacing:1px;color:var(--mut);font-weight:800;margin:12px 0 5px}.emn{display:flex;justify-content:space-between;align-items:center;gap:10px}.emn h3{margin:0;font-size:22px;word-break:break-word}
.bgb{flex:none;width:72px;height:72px;border-radius:50%;background:var(--card2);border:5px solid #e43a26;display:grid;place-items:center;text-align:center;font-size:24px;font-weight:900;line-height:1}.bgb small{margin:3px 0 0;letter-spacing:0}
.emch{display:flex;flex-wrap:wrap;gap:6px}.emch i{font-style:normal;background:var(--card2);border-radius:12px;padding:5px 10px;font-size:13.5px;font-weight:800}.emch.red i{border:2px solid #e43a26}
.emp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.emp b{display:block;font-size:15px;word-break:break-word}.cl{display:inline-block;margin-top:6px;background:var(--ac);color:var(--onac);border-radius:12px;padding:6px 10px;font-size:12.5px;font-weight:800;text-decoration:none;box-shadow:0 3px 0 var(--ac2)}
.emf{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;font-size:12px;color:var(--mut);background:var(--bg)}.emf img{width:26px;height:auto}
.bgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}.bgs button{padding:10px 0;border-radius:14px;background:var(--card);font-size:15px}.bgs .on{background:#e43a26;color:#fff}.lb{margin:12px 0 6px;font-size:13px;font-weight:800;color:var(--mut)}
.rph{display:flex;align-items:center;gap:12px;margin:12px 0}.sbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--card);margin:6px 0}.sbar i{display:block;height:100%}.sleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin-bottom:10px;color:var(--mut)}
.rpi{border-left:7px solid var(--c);background:var(--card);border-radius:14px;padding:9px 12px;margin-bottom:8px}.rpi b{display:flex;justify-content:space-between;gap:8px;font-size:14.5px}.rpi span{font-size:12px;color:var(--mut);font-weight:700}.rpi p{margin:4px 0 0;font-size:13px;white-space:pre-wrap;word-break:break-word}
.note{background:var(--card);border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--mut);margin:10px 0}#sht{display:none;width:100%;height:130px;border:0;background:var(--card);color:var(--ink);border-radius:14px;padding:10px;font:inherit;font-size:12.5px;margin-bottom:10px}
.cp.l.em{width:auto;padding:0 14px 0 10px;gap:6px;background:#e43a26;color:#fff;font-size:14px}.cp.l.em svg{width:20px;height:20px;fill:#fff}@media (max-width:350px){.cp.l.em span{display:none}.cp.l.em{width:42px;padding:0}}
.emnote{background:#ea922f33;border-left:6px solid #ea922f;border-radius:12px;padding:9px 12px;font-size:14px;font-weight:700;white-space:pre-wrap;word-break:break-word}
</style></head><body>

const themeBtn=()=>`<button class="cp r2 thb" onclick="flipTheme()" aria-label="Switch light or dark mode">${isDark()?SUN:MOON}</button>`;
function flipTheme(){document.documentElement.dataset.theme=isDark()?"light":"dark";document.querySelectorAll(".thb").forEach(b=>b.innerHTML=isDark()?SUN:MOON)}
function reviewSheet(){let r=0;const o=sheet(`<h3>Write a review</h3><p class="mut">Your feedback helps us improve Dockit. Reviews are saved on this device for now.</p><div class="stars" id="st">${[1,2,3,4,5].map(i=>`<button data-i="${i}" aria-label="${i} star">${STAR}</button>`).join("")}</div><textarea id="rt" placeholder="What do you like? What could be better?"></textarea><p class="er" id="re"></p><div class="row"><button class="btn gh" id="x">Cancel</button><button class="btn" id="ok">Submit</button></div>`);
const paint=()=>o.querySelectorAll("#st button").forEach(b=>b.classList.toggle("on",+b.dataset.i<=r));
o.querySelectorAll("#st button").forEach(b=>b.onclick=()=>{r=+b.dataset.i;paint()});
$("#x").onclick=()=>o.remove();
$("#ok").onclick=()=>{const t=$("#rt").value.trim();if(!r)return $("#re").textContent="Please tap a star rating";if(!t)return $("#re").textContent="Please write a few words";(D.rv=D.rv||[]).push({id:uid(),r,t,dt:iso()});save();o.remove();say("Thank you for your review!")}}

const FT=`<div class="ft2"><button class="ftt em" onclick="emSheet()"><i><svg viewBox="0 0 24 24"><path fill="#e43a26" d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z"/></svg></i><b>Emergency card</b><span>Blood group, allergies, contacts</span></button><button class="ftt dr" onclick="docSheet()"><i><svg viewBox="0 0 24 24"><path fill="#5aaeea" d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></i><b>Share with doctor</b><span>A clear summary</span></button></div>`;
const BG=["A+","A−","B+","B−","O+","O−","AB+","AB−"];
function emHtml(f){const e=f.em||{};
const ch=t=>t?String(t).split(/[,\n]/).map(s=>s.trim()).filter(Boolean).map(s=>`<i>${esc(s)}</i>`).join(""):"";
const call=p=>p?`<a class="cl" href="tel:${esc(String(p).replace(/[^+\d]/g,""))}">Call ${esc(p)}</a>`:"";
const none='<em class="mut">Not added</em>';
return `<div class="emc"><div class="emh"><span>EMERGENCY CARD</span><svg viewBox="0 0 24 24"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z"/></svg></div><div class="emb"><div class="emn"><div class="fi"><small>NAME</small><h3>${esc(f.n||acct().n)}</h3></div><div class="bgb"><div>${esc(e.bg||"?")}<small>Blood</small></div></div></div>
<small>ALLERGIES</small><div class="emch red">${ch(e.al)||none}</div><small>HEALTH CONDITIONS</small><div class="emch">${ch(e.co)||none}</div><small>REGULAR MEDICINES</small><div class="emch">${ch(e.md)||none}</div>${e.nt?`<small>IMPORTANT FOR HELPERS</small><div class="emnote">${esc(e.nt)}</div>`:""}
<div class="emp"><div><small>EMERGENCY CONTACT</small><b>${esc(e.cn||"Not added")}</b>${call(e.cp)}</div><div><small>MY DOCTOR</small><b>${esc(e.dn||"Not added")}</b>${call(e.dp)}</div></div></div><div class="emf">${logo(26)}<span>Made with Dockit</span></div></div>`}
const CROSS='<svg viewBox="0 0 24 24"><path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z"/></svg>';
function emSheet(h){const f=h||cur(),me=f===D.me;const o=sheet((me&&!f.em?`<p class="mut" style="margin:0 0 10px">Fill this in once. If something happens to you, anyone nearby can open this card to help.</p>`:"")+emHtml(f)+`<div class="row" style="margin-top:14px"><button class="btn gh" id="x">Close</button><button class="btn" id="ed">${f.em?"Edit":"Add info"}</button></div>`);$("#x").onclick=()=>o.remove();$("#ed").onclick=()=>{o.remove();emEdit(h)}}
function emEdit(h){const f=h||cur(),me=f===D.me,e=f.em||{};let bg=e.bg||"";const v=k=>esc(e[k]||"");
const o=sheet(`<h3>Emergency info</h3><p class="mut">${me?"Shown on your emergency card.":"Shown on the emergency card for "+esc(f.n)+"."}</p>${me?`<p class="lb">Your name</p><input class="in" id="e0" placeholder="Full name" value="${esc(f.n||acct().n)}">`:""}<p class="lb">Blood group</p><div class="bgs">${BG.map(b=>`<button data-b="${b}" class="${b==bg?"on":""}">${b}</button>`).join("")}</div><p class="lb">Allergies</p><input class="in" id="e1" placeholder="e.g. Penicillin, peanuts" value="${v("al")}"><p class="lb">Health conditions</p><input class="in" id="e2" placeholder="e.g. Asthma" value="${v("co")}"><p class="lb">Regular medicines</p><input class="in" id="e3" placeholder="e.g. Inhaler" value="${v("md")}"><p class="lb">Emergency contact</p><input class="in" id="e4" placeholder="Name" value="${v("cn")}"><input class="in" id="e5" type="tel" placeholder="Phone number" value="${v("cp")}"><p class="lb">My doctor</p><input class="in" id="e6" placeholder="Name" value="${v("dn")}"><input class="in" id="e7" type="tel" placeholder="Phone number" value="${v("dp")}"><p class="lb">Important for helpers</p><textarea id="e8" style="height:90px" placeholder="e.g. I may get confused. Please stay with me and call my emergency contact.">${v("nt")}</textarea><div class="row"><button class="btn gh" id="x">Cancel</button><button class="btn" id="ok">Save</button></div>`);
o.querySelectorAll(".bgs button").forEach(b=>b.onclick=()=>{bg=bg==b.dataset.b?"":b.dataset.b;o.querySelectorAll(".bgs button").forEach(c=>c.classList.toggle("on",c.dataset.b==bg))});
$("#x").onclick=()=>o.remove();
$("#ok").onclick=()=>{const g=i=>$("#e"+i).value.trim();if(me)f.n=g(0)==acct().n?"":g(0);f.em={bg,al:g(1),co:g(2),md:g(3),cn:g(4),cp:g(5),dn:g(6),dp:g(7),nt:g(8)};save();o.remove();render();emSheet(h)}}
function textSummary(f){const e=f.em||{},L=["DOCKIT HEALTH SUMMARY","Name: "+f.n+" ("+f.t+")","Date: "+fdt(iso())];
[["Blood group",e.bg],["Allergies",e.al],["Conditions",e.co],["Medicines",e.md]].forEach(([k,x])=>x&&L.push(k+": "+x));L.push("");
f.m.slice().sort((a,b)=>b.s-a.s).forEach(m=>L.push("- "+S[m.s].n.toUpperCase()+": "+m.r+" ("+mdt(m)+")"+(m.n?"\n  "+m.n.replace(/\n/g,"\n  "):"")));
L.push("","Shared from Dockit. This is a personal record, not a diagnosis.");return L.join("\n")}
async function shareDoc(f){const t=textSummary(f);
try{if(navigator.share){await navigator.share({title:"Dockit summary: "+f.n,text:t});return}}catch(e){if(e&&e.name=="AbortError")return}
try{await navigator.clipboard.writeText(t);say("Summary copied. Paste it into a message to your doctor.");return}catch(e){}
const a=$("#sht");a.style.display="block";a.value=t;a.select()}
function docSheet(){const f=cur(),ms=f.m.slice().sort((a,b)=>b.s-a.s),w=worst(f),seg=[3,2,1,0].map(i=>[i,f.m.filter(m=>m.s==i).length]).filter(x=>x[1]);
const o=sheet(`<h3>Share with my doctor</h3><p class="mut">A clear, read-only summary of this folder.</p><div class="rph"><div class="av" style="background:${w<0?"var(--organ)":S[w].c}">${esc(f.n[0].toUpperCase())}</div><div class="fi"><b>${esc(f.n)}</b><span class="mut">${f.t} · ${fdt(iso())}</span></div></div>${ms.length?`<div class="sbar">${seg.map(([i,c])=>`<i style="flex:${c};background:${S[i].c}"></i>`).join("")}</div><div class="sleg">${seg.map(([i,c])=>`<span>${c} ${S[i].n}</span>`).join("")}</div>`:""}${ms.map(m=>`<div class="rpi" style="--c:${S[m.s].c}"><b>${m.r}<span>${mdt(m)}</span></b><p>${m.n?esc(m.n):"No notes"}</p></div>`).join("")||`<div class="empty">Nothing marked yet.</div>`}<p class="note">You are sharing health information. Send it only to your doctor.</p><textarea id="sht" readonly></textarea><div class="row"><button class="btn gh" id="pf">Save PDF</button><button class="btn" id="sd">Share</button></div>`);
$("#pf").onclick=()=>exportPdf();$("#sd").onclick=()=>shareDoc(f)}
function profile(){const o=sheet(`<h3>Hi, ${esc(acct().n)}</h3><p class="mut">Your data stays on this device.</p><p class="mut" style="margin-top:4px">Dockit version 1.0.0</p><div style="margin-top:14px"><button class="btn dg" id="lo">Log out</button></div>`);

$("#splash").innerHTML=`${logo(210,1)}<h2>Dockit</h2><p>The Doctor’s Kit</p>`;
try{const s=sessionStorage.getItem("dockit_s");if(s&&A.l.find(x=>x.id==s)){U=s;load(s)}}catch(e){}
