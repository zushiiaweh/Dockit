.pg.torn{animation:tear .65s ease-in forwards}@keyframes tear{0%{transform:none}22%{transform:rotate(-4deg) translateY(3px)}100%{transform:translate(-40%,-135%) rotate(-30deg);opacity:0}}
.med{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:100%;min-height:100%;background:var(--card);border-radius:26px;padding:10px;box-shadow:0 5px 0 var(--edge),0 12px 18px var(--sh),inset 0 2px 0 var(--hi);text-align:center}.med .bk{height:72px;display:grid;place-items:center}.med b{font-size:17px;font-weight:800}.med .mut{font-size:12.5px}
.pb{width:78%;height:8px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:var(--ac);border-radius:4px}
.mrow{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:24px;padding:14px;margin-bottom:6px;box-shadow:0 5px 0 var(--edge),0 12px 18px var(--sh)}
.ring{width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--card2) 0);display:grid;place-items:center;flex:none;position:relative}.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card)}.ring b{position:relative;font-size:16px}

const nowT=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const ft=t=>{if(!t)return"";const[h,m]=t.split(":").map(Number);return((h%12)||12)+":"+String(m).padStart(2,"0")+" "+(h<12?"am":"pm")};
const ageOf=d=>{if(!d)return"";const b=new Date(d+"T00:00"),n=new Date();let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth();if(n.getDate()<b.getDate())m--;if(m<0){y--;m+=12}if(isNaN(y)||y<0)return"";return y<2?(y*12+m)+" months":y+" years"};
const mdtt=m=>mdt(m)+(m.tm?", "+ft(m.tm):"");
const pro=()=>D.mode=="pro",FL=()=>D.f.filter(f=>pro()?f.t=="Patient":(f.t=="Myself"||f.t=="Family")),MD=()=>pro()?"pro":"personal";

const addDays=(d,n)=>{const x=new Date(d+"T00:00");x.setDate(x.getDate()+n);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const dlFile=(n,b)=>{const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},1500)};
const icsT=s=>String(s||"").replace(/\\/g,"\\\\").replace(/[;,]/g,m=>"\\"+m).replace(/\n/g,"\\n");
function icsEv(e){const p=x=>String(x).padStart(2,"0"),tm=e.tm||"09:00",en=new Date(e.dt+"T"+tm+":00");en.setMinutes(en.getMinutes()+(e.len||60));
const f=d=>d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"T"+p(d.getHours())+p(d.getMinutes())+"00",st=new Date(e.dt+"T"+tm+":00");
return["BEGIN:VEVENT","UID:"+uid()+uid()+"@dockit","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,""),"DTSTART:"+f(st),"DTEND:"+f(en),e.rr?"RRULE:"+e.rr:"","SUMMARY:"+icsT(e.t),e.pl?"LOCATION:"+icsT(e.pl):"","DESCRIPTION:"+icsT(e.nt||""),"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsT(e.t),"TRIGGER:"+(e.al?"-":"")+"PT"+(e.al||0)+"M","END:VALARM","END:VEVENT"].filter(Boolean).join("\r\n")}
